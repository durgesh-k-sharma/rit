[package]
name = "rit"
version = "0.0.0"
edition = "2024"
description = "A minimal Git implementation in Rust"
license = "MIT"

[[bin]]
name = "rit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
sha1_smol = "1"
flate2 = "1"
chrono = { version = "0.4", features = ["std"], default-features = false }
hex = "0.4"
fastrand = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
